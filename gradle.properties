org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# TEMPLATE: everything module-specific lives here. app/build.gradle.kts reads these values,
# generates META-INF/xposed/module.prop and scope.list, and exposes them through BuildConfig.
# versionCode = major * 10000 + minor * 100 + patch
version.name=1.0.0
version.code=10000

# Package the module hooks (also written to scope.list). Comma-separated for several.
target.package=com.example.target
# Human-readable name of the hooked app, shown in the UI ("Apply and restart <name>").
target.label=Target App
module.id=io.github.chalicechore.moduletemplate
module.name=Module Template
module.author=ChaliceChore
module.description=Placeholder description of what this module does
# GitHub owner/repo, used by the About screen links.
module.repo=ChaliceChore/Lsposed-Module-Template
module.license=GPL-3.0
# Weblate project page for the "Help translate" row in About. Leave empty to hide the row.
# Placeholder until the Weblate project exists.
module.translate=https://hosted.weblate.org/projects/lsposed-module-template/
xposed.api.min=102
xposed.api.target=102
